# ==============================================================================
# Override de PRODUÇÃO — ativado pelo COMPOSE_FILE do .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# Muda três coisas em relação à base:
#
#   1. Postgres e cérebro deixam de publicar porta: só o gateway as alcança, pela
#      rede interna do compose. O gateway publica 8080 só em 127.0.0.1 (herdado
#      da base) — o proxy reverso que termina o HTTPS e entrega /webhook ao
#      gateway é da infra da Infominas (P10, ver deploy/README.md). Se o proxy
#      rodar como container, ponha-o na rede deste compose e fale com
#      `gateway:8080`; o `ports` do gateway pode então ser removido.
#   2. restart automático.
#   3. teto de logs (json-file), para o disco não encher.
#
# Imagens: por padrão são construídas no próprio host (`docker compose up -d
# --build`) com a tag de IMAGE_TAG. Quando existir registry, publique as
# imagens, preencha IMAGE_REPO/IMAGE_TAG e suba sem --build.
# Requer docker compose >= 2.24.4 (tag !reset).
# ==============================================================================
services:
  pgvector:
    ports: !reset []
    restart: unless-stopped
    logging: &log
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  brain:
    ports: !reset []
    restart: unless-stopped
    logging: *log

  gateway:
    restart: unless-stopped
    logging: *log
