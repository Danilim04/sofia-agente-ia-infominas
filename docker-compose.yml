# ==============================================================================
# Stack do bot (base) — cérebro Python (Contrato A) + gateway Go (Chatwoot)
# + Postgres/pgvector (RAG do cérebro E estado do gateway).
#
# Dev local:   docker compose up --build   (portas em localhost, build local)
# Produção:    COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml no .env
#              (imagens pinadas por tag, sem build, rede do Chatwoot — ver
#              docker-compose.prod.yml e deploy/deploy-remote.sh)
#
# O .env único na raiz alimenta os serviços (ver .env.example). O que é
# "fiação" entre containers (URLs internas, paths) mora AQUI em environment:
# — vence o .env e não depende de ninguém preencher certo.
# ==============================================================================
name: azapfy-bot

services:
  # Postgres + pgvector: índice do RAG (tabelas rag_* — Contrato B, ver
  # plano-migracao-pgvector.md) e persistência do gateway (schema `gateway`:
  # dedup, estado do gate de identidade, cache telefone→perfil). É ESTADO de
  # produção: o volume pgvector-data precisa de backup.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?defina PGVECTOR_PASSWORD no .env}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    ports:
      # dev: `python -m src.rag.sync` / `verificar` rodando fora do docker
      - '127.0.0.1:5432:5432'
    healthcheck:
      # -h 127.0.0.1: o servidor temporário do init só escuta no socket unix;
      # sem o host o check passa cedo demais (antes do servidor de verdade).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U rag -d rag']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  brain:
    image: ${IMAGE_REPO:-azapfy-bot}:brain-${IMAGE_TAG:-dev}
    build: ./agente-ia
    env_file:
      # required:false só para `compose config`/build funcionarem sem .env;
      # para SUBIR a stack o .env é indispensável (cp .env.example .env).
      - path: .env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
      DOCS_DIR: /app/docs
      # Histórico de conversa persistente (checkpointer SQLite do LangGraph) —
      # sem o volume, um restart do brain apagaria a memória das conversas.
      CHECKPOINT_DB_PATH: /data/checkpoints.db
      # Tools de chamado (SAC) que o cérebro chama no gateway.
      SAC_TOOLS_BASE_URL: http://gateway:8080
      # Índice pgvector (escrita do sync sempre; leitura só com VECTOR_BACKEND=pgvector).
      PGVECTOR_URL: postgresql://rag:${PGVECTOR_PASSWORD:-}@pgvector:5432/rag
    volumes:
      - brain-data:/data
    ports:
      - '127.0.0.1:8001:8001'
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # o import da app compila o grafo e abre o Chroma — dá um fôlego
      start_period: 40s

  gateway:
    image: ${IMAGE_REPO:-azapfy-bot}:gateway-${IMAGE_TAG:-dev}
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '8080'
      BRAIN_BASE_URL: http://brain:8001
      # Estado do gateway no Postgres (schema `gateway`, criado no boot).
      PG_URL: postgresql://rag:${PGVECTOR_PASSWORD:-}@pgvector:5432/rag
      # Legado: SQLite só é usado quando PG_URL está vazio. O volume fica
      # montado para consulta/migração manual do gateway.db antigo.
      DB_PATH: /data/gateway.db
    volumes:
      - gateway-data:/data
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgvector-data:
  gateway-data:
  brain-data:
