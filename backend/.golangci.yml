# golangci-lint v2 — camada 1 da esteira (docs/plano/04-esteira-qualidade.md).
# Rodar: cd backend && golangci-lint run ./...   (scripts/verificar.sh --completo)
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - bodyclose
    - noctx
    - gocritic
  settings:
    # depguard saiu em E1.1: as dependências do domínio antigo não existem mais
    # e o teste de arquitetura (internal/arquitetura) impede que voltem.
    gosec:
      excludes:
        - G104 # erros não checados: já coberto por errcheck com mensagens melhores
    revive:
      rules:
        - name: exported
          disabled: true # comentários de export não são exigidos; o pacote tem doc no topo
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
