# golangci-lint v2 — camada 1 da esteira (docs/plano/04-esteira-qualidade.md).
# Rodar: cd backend && golangci-lint run ./...   (scripts/verificar.sh --completo)
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - bodyclose
    - noctx
    - gocritic
    - depguard
  settings:
    depguard:
      rules:
        legado:
          deny:
            - pkg: go.mongodb.org/mongo-driver
              desc: "Mongo saiu do projeto (ADR 0003): identidade vem do telefone + CPF"
            - pkg: bot-azapfy
              desc: "módulo renomeado para bot-infominas (E0.6)"
    gosec:
      excludes:
        - G104 # erros não checados: já coberto por errcheck com mensagens melhores
    revive:
      rules:
        - name: exported
          disabled: true # comentários de export não são exigidos; o pacote tem doc no topo
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      # Pacotes com data marcada para sair na Onda 1 (E1.1): não vale a pena
      # corrigir lint neles. REMOVER estas linhas junto com os pacotes.
      - internal/chatwoot
      - internal/mongo
      - internal/sac
      - internal/identity

formatters:
  enable:
    - gofmt
