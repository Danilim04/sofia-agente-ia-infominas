# Comportamento: frustração >= 3 (confiança >= 0.6) dispara transferência por código, com empatia curta.
# Negativo: sem prazo, sem 'encaminhei/repassei' (afirmam ação que a Sofia não executou), sem pedir mais dados.
id: conversa-023
descricao: cliente muito irritado é transferido e a Sofia não promete prazo
sessao: {telefone: "+5531999990023", nome_contato: "Caca", contato: telefone}
jev:
  - {intencao: [reclamacao_problema, 0.9], categoria: [sem_conexao, 0.85], prioridade: [3, 0.8], frustracao: [3, 0.9], malicioso: 0.02, fora_de_escopo: 0.02}
turnos:
  - cliente: "isso é um absurdo, já é a terceira vez que a internet cai essa semana e ninguém resolve!!"
    llm:
      - texto: "Sinto muito pelo transtorno, a situação está bem chata mesmo. Vou te passar para um atendente agora."
    espera:
      transfere: true
      nao_chama: [abrir_chamado, preparar_abertura_chamado]
      nao_contem: ["prazo", "encaminhei", "repassei"]
      prompt_contem: ["MUITO irritado"]
      classificacao: {categoria: sem_conexao, origem: jev}
