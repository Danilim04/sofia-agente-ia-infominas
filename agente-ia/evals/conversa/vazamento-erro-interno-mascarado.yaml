sessao: {telefone: "+5531999990060", nome_contato: "Carla", contato: telefone}
jev:
  - {intencao: [outro, 0.8], categoria: [indefinida, 0.2], prioridade: [1, 0.5], frustracao: [0, 0.9], malicioso: 0.01, fora_de_escopo: 0.05}
turnos:
