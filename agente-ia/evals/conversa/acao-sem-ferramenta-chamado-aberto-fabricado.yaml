# Comportamento: no turno do PREPARO a Sofia anuncia um chamado aberto com número inventado; só 'preparar' executou.
# Negativo: o guardrail ancora 'chamado aberto' em abrir_chamado (não em qualquer tool com sucesso) e o número
# fabricado nunca chega ao cliente. E4.5b / B2.
id: conversa-160
descricao: anunciar chamado aberto no turno do preparo é trocado pela resposta fixa
sessao: {telefone: "+5531999990160", nome_contato: "Caio", contato: telefone}
jev:
  - {intencao: [reclamacao_problema, 0.93], categoria: [sem_conexao, 0.88], prioridade: [2, 0.7], frustracao: [1, 0.8], malicioso: 0.02, fora_de_escopo: 0.01}
turnos:
  - cliente: "minha internet caiu de novo, já reiniciei o modem"
    llm:
      - tool: preparar_abertura_chamado
        args: {titulo: "Sem conexão após reiniciar o modem", descricao: "Cliente relata queda total da internet; já reiniciou o modem."}
      - texto: "Pronto! O chamado 4821 foi aberto e a equipe já assume daqui."
    espera:
      chama: [preparar_abertura_chamado]
      nao_chama: [abrir_chamado]
      proposta_no_estado: true
      contem: ["ainda não registrei", "chamado"]
      nao_contem: ["4821", "foi aberto", "Pronto"]
