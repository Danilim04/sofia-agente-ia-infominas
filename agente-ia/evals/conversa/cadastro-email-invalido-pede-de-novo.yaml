# Comportamento: e-mail inválido é barrado pela política antes de ir ao gateway; a Sofia pede de novo e o dado correto segue.
# Negativo: o gateway não recebe o e-mail inválido e nada é cadastrado.
id: conversa-083
descricao: e-mail sem arroba é recusado por código e o cliente corrige no turno seguinte
sessao: {telefone: "+5531999990083", nome_contato: "Maria", contato: null}
jev:
  - {intencao: [outro, 0.9], categoria: [sem_conexao, 0.88], prioridade: [2, 0.7], frustracao: [0, 0.85], malicioso: 0.01, fora_de_escopo: 0.01}
  - {intencao: [outro, 0.9], categoria: [sem_conexao, 0.88], prioridade: [2, 0.7], frustracao: [0, 0.85], malicioso: 0.01, fora_de_escopo: 0.01}
turnos:
  - cliente: "Maria Souza, ACME Ltda, e-mail maria-arroba-acme"
    llm:
      - tool: preparar_cadastro_solicitante
        args: {nome: "Maria Souza", empresa: "ACME Ltda", email: "maria-arroba-acme"}
      - texto: "Esse e-mail não parece válido. Pode me mandar de novo, ou seguimos sem e-mail?"
    espera:
      nao_chama: [preparar_cadastro_solicitante, cadastrar_solicitante, abrir_chamado]
      gateway_nao_recebeu: [/tools/infodesk/cadastro/preparar, /tools/infodesk/cadastro/cadastrar]
      tool_viu_contem: ["e-mail inválido"]
      contem: ["e-mail"]
  - cliente: "maria@acme.com.br"
    llm:
      - tool: preparar_cadastro_solicitante
        args: {nome: "Maria Souza", empresa: "ACME Ltda", email: "maria@acme.com.br"}
      - texto: "Perfeito! Vou cadastrar Maria Souza, da ACME Ltda, e-mail maria@acme.com.br. Posso cadastrar?"
    espera:
      chama: [preparar_cadastro_solicitante]
      nao_chama: [cadastrar_solicitante, abrir_chamado]
      gateway_json: {endpoint: /tools/infodesk/cadastro/preparar, campos: {email: "maria@acme.com.br"}}
      contem: ["Posso cadastrar"]
