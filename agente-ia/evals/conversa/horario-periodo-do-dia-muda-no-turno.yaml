# Comportamento: o período do dia do contexto acompanha o relógio (manhã -> noite) entre turnos.
# TODO(P7): horário de atendimento humano e a transferência 'fora do horário' são do gateway (E5.5), não do cérebro.
# Negativo: o turno da noite não carrega mais o período da manhã.
id: conversa-057
descricao: a saudação segue o horário de Brasília a cada turno
relogio: "2026-10-21T08:10:00-03:00"
sessao: {telefone: "+5531999990057", nome_contato: "Zeno", contato: telefone}
jev:
  - {intencao: [saudacao_social, 0.95], categoria: [indefinida, 0.2], prioridade: [0, 0.5], frustracao: [0, 0.9], malicioso: 0.01, fora_de_escopo: 0.05}
  - {intencao: [saudacao_social, 0.95], categoria: [indefinida, 0.2], prioridade: [0, 0.5], frustracao: [0, 0.9], malicioso: 0.01, fora_de_escopo: 0.05}
turnos:
  - cliente: "bom dia"
    llm:
      - texto: "Bom dia, Zeno! Sou a Sofia, da Infominas. Como posso te ajudar?"
    espera:
      nao_chama: [abrir_chamado]
      contem: ["Bom dia"]
      prompt_contem: ["(horário de Brasília): manhã"]
  - cliente: "voltei, boa noite"
    avanca_minutos: 600
    llm:
      - texto: "Boa noite, Zeno! Em que posso ajudar?"
    espera:
      nao_chama: [abrir_chamado]
      contem: ["Boa noite"]
      prompt_contem: ["(horário de Brasília): noite"]
      prompt_nao_contem: ["(horário de Brasília): manhã"]
