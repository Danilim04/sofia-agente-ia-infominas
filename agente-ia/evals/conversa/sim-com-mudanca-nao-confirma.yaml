# Comportamento: 'sim, mas ...' é pedido de mudança: prepara de novo e pede nova confirmação.
# Negativo: o primeiro turno de confirmação não abre.
id: conversa-034
descricao: confirmação com ressalva refaz a proposta antes de abrir
sessao: {telefone: "+5531999990034", nome_contato: "Tati", contato: telefone}
jev:
  - {intencao: [reclamacao_problema, 0.93], categoria: [sem_conexao, 0.88], prioridade: [2, 0.7], frustracao: [1, 0.8], malicioso: 0.02, fora_de_escopo: 0.01}
  - {intencao: [reclamacao_problema, 0.93], categoria: [sem_conexao, 0.88], prioridade: [2, 0.7], frustracao: [1, 0.8], malicioso: 0.02, fora_de_escopo: 0.01}
  - {intencao: [confirmacao, 0.95], categoria: [sem_conexao, 0.9], prioridade: [2, 0.7], frustracao: [0, 0.8], malicioso: 0.01, fora_de_escopo: 0.01}
turnos:
  - cliente: "minha internet caiu de novo, já reiniciei o modem"
    llm:
      - tool: preparar_abertura_chamado
        args: {titulo: "Sem conexão após reiniciar o modem", descricao: "Cliente relata queda total da internet; já reiniciou o modem."}
      - texto: "Entendi, ficar sem internet atrapalha mesmo. Vou registrar assim: sem conexão mesmo depois de reiniciar o modem. Posso abrir o chamado?"
    espera: {chama: [preparar_abertura_chamado], nao_chama: [abrir_chamado], proposta_no_estado: true, contem: ["Posso abrir"]}
  - cliente: "sim, mas escreve que começou ontem à noite"
    llm:
      - tool: abrir_chamado
        args: {}
      - tool: preparar_abertura_chamado
        args: {titulo: "Sem conexão desde ontem à noite", descricao: "Cliente relata queda total desde ontem à noite; já reiniciou o modem."}
      - texto: "Claro, ajustei: sem conexão desde ontem à noite. Posso abrir o chamado assim?"
    espera:
      chama: [preparar_abertura_chamado]
      nao_chama: [abrir_chamado]
      gateway_nao_recebeu: [/tools/infodesk/ticket/abrir]
      proposta_no_estado: true
  - cliente: "pode abrir"
    llm:
      - tool: abrir_chamado
        args: {}
      - texto: "Pronto! Seu chamado é o 48213. A equipe responsável assume daqui. 😊"
    espera:
      chama: [abrir_chamado]
      gateway_recebeu: {endpoint: /tools/infodesk/ticket/abrir, chave_idempotencia: "*"}
      nao_contem: ["prazo"]
