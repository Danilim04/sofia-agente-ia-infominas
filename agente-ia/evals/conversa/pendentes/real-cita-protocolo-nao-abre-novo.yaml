# Destrava: Q1 — aprovar as categorias de config/taxonomia.proposta.yaml e promovê-la a taxonomia.yaml; depois `git mv` para evals/conversa/.
id: conversa-142
descricao: reclamar citando um chamado existente não prepara chamado novo (política em código)
sessao:
  telefone: '+5531999990142'
  nome_contato: Gil
