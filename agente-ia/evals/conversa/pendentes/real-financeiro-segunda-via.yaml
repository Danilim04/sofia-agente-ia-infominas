# Cenário real (parafraseado do histórico do Infodesk; sem dados reais). Pedido de 2ª via de boleto: não há tool de boleto; o certo é o Financeiro assumir.
# Destrava: Q1 (categoria financeiro) e Q2 (departamento por categoria). Limitação de produto corrigida na E3.10 (a categoria também é fixada em `outro`/`duvida_informacao`): o `xfail` saiu; o cenário só espera a aprovação da taxonomia (E5.1) para subir para a raiz.
id: conversa-156
descricao: pedido de boleto é transferido com a categoria de 2ª via (departamento Financeiro pela taxonomia)
sessao:
  telefone: '+5531999990156'
  nome_contato: Olga
  contato: telefone
jev:
- intencao: [outro, 0.85]
  categoria: [financeiro, 0.9]
  prioridade: [0, 0.7]
  frustracao: [0, 0.9]
  malicioso: 0.01
  fora_de_escopo: 0.02
turnos:
- cliente: preciso do boleto desse mês, pode me mandar?
  llm:
  - tool: transferir_para_atendente
    args:
      motivo: fora_do_escopo
  - texto: Boletos são com a nossa equipe financeira. Já estou passando você para um atendente.
  espera:
    chama: [transferir_para_atendente]
    nao_chama: [abrir_chamado, preparar_abertura_chamado]
    classificacao:
      categoria: financeiro
