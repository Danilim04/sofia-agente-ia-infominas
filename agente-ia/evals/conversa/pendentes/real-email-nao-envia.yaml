# RESULTADO ESPERADO HOJE: esclarece uma vez e transfere. Com a taxonomia real (E5.1: e_mail_incidente) deveria abrir chamado.
id: conversa-120
descricao: 'e-mail que não envia sem categoria na taxonomia: esclarece uma vez e transfere'
sessao:
  telefone: '+5531999990120'
  nome_contato: Gabi
  contato: telefone
jev:
- intencao: [reclamacao_problema, 0.9]
  categoria: [indefinida, 0.4]
  prioridade: [1, 0.7]
  frustracao: [1, 0.8]
  malicioso: 0.02
  fora_de_escopo: 0.02
- intencao: [reclamacao_problema, 0.88]
  categoria: [indefinida, 0.42]
  prioridade: [1, 0.7]
  frustracao: [1, 0.8]
  malicioso: 0.02
  fora_de_escopo: 0.02
turnos:
- cliente: não estou conseguindo enviar e-mail
  llm:
  - texto: 'Entendi! Me conta um pouco mais: a mensagem fica parada na caixa de saída ou aparece algum erro?'
  espera:
    nao_chama: [preparar_abertura_chamado, abrir_chamado]
    transfere: false
    proposta_no_estado: false
    contem: ['?']
- cliente: fica na caixa de saída e não sai nada
  llm:
  - texto: Obrigada pelos detalhes. Vou te passar para um atendente continuar daqui.
  espera:
    nao_chama: [abrir_chamado]
    transfere: true
    contem: [atendente]
    nao_contem: [prazo, encaminhei]
