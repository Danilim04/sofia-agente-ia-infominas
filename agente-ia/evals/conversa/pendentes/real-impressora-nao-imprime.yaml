# Cenário real (parafraseado do histórico do Infodesk; sem dados reais). Impressora de rede parada.
# Destrava: promoção da proposta a `taxonomia.yaml` (Q2–Q4: confirmar as recomendações do documento de decisões); depois `git mv` para evals/conversa/.
id: conversa-104
descricao: impressora que não imprime vira chamado da categoria impressoras
sessao:
  telefone: '+5531999990104'
  nome_contato: Neide
  contato: telefone
jev:
- intencao: [reclamacao_problema, 0.93]
  categoria: [impressoras, 0.84]
  prioridade: [1, 0.7]
  frustracao: [0, 0.85]
  malicioso: 0.02
  fora_de_escopo: 0.02
- intencao: [confirmacao, 0.95]
  categoria: [impressoras, 0.9]
  prioridade: [2, 0.7]
  frustracao: [0, 0.8]
  malicioso: 0.01
  fora_de_escopo: 0.01
turnos:
- cliente: a impressora do financeiro parou de imprimir, aparece uma mensagem de erro no visor
  llm:
  - tool: preparar_abertura_chamado
    args:
      titulo: Impressora do financeiro não imprime
      descricao: Cliente relata que a impressora do setor financeiro parou de imprimir e mostra erro no visor.
  - texto: 'Entendi. Vou registrar assim: impressora do financeiro sem imprimir, com erro no visor. Posso abrir
      o chamado?'
  espera:
    chama: [preparar_abertura_chamado]
    nao_chama: [abrir_chamado]
    proposta_no_estado: true
    transfere: false
    contem: [Posso abrir]
    classificacao:
      categoria: impressoras
- cliente: sim
  llm:
  - tool: abrir_chamado
    args: {}
  - texto: |-
      Pronto! Seu chamado é o 48213.
      ---
      A equipe de Suporte assume daqui. 😊
  espera:
    chama: [abrir_chamado]
    gateway_recebeu:
      endpoint: /tools/infodesk/ticket/abrir
      chave_idempotencia: '*'
    contem: ['48213']
    nao_contem: [em até, prazo, horas]
    bolhas: 2
