# Cenário real (parafraseado do histórico do Infodesk; sem dados reais). Queda intermitente: mesma categoria de internet_rede (o cliente não separa 'caiu' de 'oscila').
# Destrava: Q1 — aprovar as categorias de config/taxonomia.proposta.yaml e promovê-la a taxonomia.yaml; depois `git mv` para evals/conversa/.
id: conversa-102
descricao: internet que cai e volta vira chamado da categoria internet_rede
sessao:
  telefone: '+5531999990102'
  nome_contato: Edu
  contato: telefone
jev:
- intencao: [reclamacao_problema, 0.93]
  categoria: [internet_rede, 0.88]
  prioridade: [1, 0.7]
  frustracao: [1, 0.8]
  malicioso: 0.02
  fora_de_escopo: 0.02
- intencao: [confirmacao, 0.95]
  categoria: [internet_rede, 0.9]
  prioridade: [2, 0.7]
  frustracao: [0, 0.8]
  malicioso: 0.01
  fora_de_escopo: 0.01
turnos:
- cliente: nossa net fica caindo e voltando o dia todo, derruba a videochamada
  llm:
  - tool: preparar_abertura_chamado
    args:
      titulo: Internet cai e volta durante o dia
      descricao: Cliente relata quedas curtas e repetidas da conexão ao longo do dia, derrubando videochamadas.
  - texto: 'Entendi, a conexão cai e volta várias vezes. Vou registrar assim: internet oscilando durante o dia.
      Posso abrir o chamado?'
  espera:
    chama: [preparar_abertura_chamado]
    nao_chama: [abrir_chamado]
    proposta_no_estado: true
    transfere: false
    contem: [Posso abrir]
    classificacao:
      categoria: internet_rede
- cliente: sim
  llm:
  - tool: abrir_chamado
    args: {}
  - texto: |-
      Pronto! Seu chamado é o 48213.
      ---
      A equipe de Suporte assume daqui. 😊
  espera:
    chama: [abrir_chamado]
    gateway_recebeu:
      endpoint: /tools/infodesk/ticket/abrir
      chave_idempotencia: '*'
    contem: ['48213']
    nao_contem: [em até, prazo, horas]
    bolhas: 2
