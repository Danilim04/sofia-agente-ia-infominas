# Comportamento: HTTP 500 do gateway vira 'tente mais tarde'; a consulta não é repetida.
# Negativo: nada de 500, 'gateway' ou código técnico para o cliente.
id: conversa-045
descricao: falha de transporte na consulta degrada com educação
sessao: {telefone: "+5531999990045", nome_contato: "Caio", contato: telefone}
jev:
  - {intencao: [status_chamado, 0.92], categoria: [indefinida, 0.3], prioridade: [1, 0.7], frustracao: [0, 0.85], malicioso: 0.01, fora_de_escopo: 0.01}
turnos:
  - cliente: "como está o chamado 48213?"
    gateway: {ticket/consultar: http_500}
    llm:
      - tool: consultar_status_chamado
        args: {numero: "48213"}
      - texto: "Não consegui consultar o chamado agora. Pode tentar de novo daqui a pouco, ou prefere que eu chame um atendente?"
    espera:
      chama: [consultar_status_chamado]
      nao_chama: [abrir_chamado, preparar_abertura_chamado]
      nao_contem: ["500", "gateway", "infodesk_indisponivel", "erro interno"]
      gateway_vezes: {/tools/infodesk/ticket/consultar: 1}
