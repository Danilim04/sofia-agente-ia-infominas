# ==============================================================================
# CI — camadas 1 e 2 da esteira (docs/plano/04-esteira-qualidade.md).
# Os jobs abaixo são os checks obrigatórios da branch protection da main:
#   lint-python · lint-go · arquitetura · test-python · test-go · contratos ·
#   e2e · evals-pr · gitleaks
# `auditoria-dependencias` (govulncheck + pip-audit) NÃO é obrigatório: só avisa.
# Actions fixadas por SHA (versão legível no comentário); golangci-lint e gitleaks
# em versão fixa (este com checksum). Cada job roda o MESMO comando que scripts/verificar.sh
# roda localmente, exceto `contratos` (go test -run Contrato + pytest -k contrato), que hoje só
# existe aqui; no verificar.sh o lado de contrato já corre dentro do go test e do pytest.
# ==============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------ Python
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: agente-ia } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agente-ia/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      # evals/ entra quando existir (E1.5) — mesmo critério do scripts/verificar.sh
      - run: |
          ALVOS="src tests"; [ -d evals ] && ALVOS="$ALVOS evals"
          python -m ruff format --check $ALVOS
          python -m ruff check $ALVOS

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: agente-ia } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "agente-ia/requirements*" }
      # torch CPU antes do resto (mesmo truque do Dockerfile) — evita baixar CUDA.
      # Depois o MESMO lock com hashes da imagem de produção; só então os extras
      # de teste (chainlit, pytest, ruff…), que respeitam as versões já instaladas.
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          pip install --no-deps --require-hashes -r requirements-prod.lock
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m mypy
      - name: mypy evals (quando existir)
        run: if [ -d evals ]; then python -m mypy evals; fi
      - name: pytest (unit, sem rede)
        run: python -m pytest --cov=src --cov-report=term-missing:skip-covered
        env:
          OPENROUTER_API_KEY: test-openrouter-key

  # ---------------------------------------------------------------------- Go
  lint-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        # Versão fixa (reprodutível); subir de propósito em PR próprio.
        with: { version: v2.15.0, working-directory: backend }

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: rag, POSTGRES_USER: rag, POSTGRES_PASSWORD: rag }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - working-directory: backend
        run: go vet ./...
      - name: go test -race (SQLite e Postgres)
        working-directory: backend
        run: go test -race -cover ./...
        env:
          PG_TEST_URL: postgresql://rag:rag@localhost:5432/rag

  # ------------------------------------------------------------ Arquitetura
  arquitetura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "agente-ia/requirements*" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - working-directory: agente-ia
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          pip install --no-deps --require-hashes -r requirements-prod.lock
          pip install -r requirements.txt -r requirements-dev.txt
      - name: import-linter (camadas do cérebro)
        working-directory: agente-ia
        run: lint-imports
      - name: testes de arquitetura (Python + varredura de legado)
        working-directory: agente-ia
        run: python -m pytest tests/test_arquitetura.py -v
        env:
          OPENROUTER_API_KEY: test-openrouter-key
      - name: testes de arquitetura (Go)
        working-directory: backend
        run: go test ./internal/arquitetura/... -v

  # ------------------------------------------------- Contratos, E2E, evals
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "agente-ia/requirements*" }
      # Lado Go: todo teste cujo nome tem "Contrato" (toolsapi decodifica contratos/**;
      # brain/alerta checam o Contrato A e os campos dos eventos). -count=1: nunca do cache.
      - name: contrato — lado Go
        working-directory: backend
        run: go test -count=1 -run Contrato ./...
      - name: contrato — instala o cérebro (lock + extras de teste)
        working-directory: agente-ia
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          pip install --no-deps --require-hashes -r requirements-prod.lock
          pip install -r requirements.txt -r requirements-dev.txt
      # Lado Python: -k contrato casa pelo nome (pytest sai com 5 se NENHUM teste
      # casar, então este passo falha em vez de ficar verde sem rodar nada).
      - name: contrato — lado Python
        working-directory: agente-ia
        run: python -m pytest -k contrato -v --no-cov
        env:
          OPENROUTER_API_KEY: test-openrouter-key

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      # O mock-infodesk e o cérebro falso são stdlib: só precisam de um Python 3.12+.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      # Sobe mock-infodesk + gateway + cérebro falso (sem rede, sem chave). O bug
      # conhecido do cenário 1 (BUG-E4.1-1) foi corrigido na E4.5a: o assert vale sempre.
      - name: E2E com mock-infodesk
        working-directory: backend
        run: go test -tags e2e -count=1 -v ./internal/e2e/...
        env:
          E2E_PYTHON: python

  evals-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: agente-ia } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "agente-ia/requirements*" }
      - name: evals determinísticos de conversa
        run: |
          if [ ! -d evals ]; then
            echo "agente-ia/evals ainda não existe (entra em E1.5)"; exit 0
          fi
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          pip install --no-deps --require-hashes -r requirements-prod.lock
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q -m evals_pr evals/
        env:
          OPENROUTER_API_KEY: test-openrouter-key

  # --------------------------------------------------------------- Segredos
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - name: gitleaks (binário oficial; sem licença de org)
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          v=8.30.0
          # sha256 de gitleaks_8.30.0_linux_x64.tar.gz, do gitleaks_8.30.0_checksums.txt
          # da release oficial. Ao subir a versão, atualize os DOIS (v e sha).
          sha=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSLfo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Sem --log-opts o gitleaks faz `git log --all`: varre TODAS as branches do
          # remoto, e um achado em qualquer branch quebra todos os PRs. Em PR varre só
          # os commits do PR (base..HEAD); no push da main, o histórico inteiro.
          # -v: sem ele o log só diz "leaks found: N", sem arquivo nem linha.
          opts=""
          if [ "$EVENTO" = "pull_request" ]; then
            opts="--log-opts=origin/${BASE_REF}..HEAD"
          fi
          ./gitleaks detect --source . -v --redact=50 --no-banner --config .gitleaks.toml $opts

  # ------------------------------------------------- Auditoria de dependências
  # SÓ AVISA (continue-on-error) e não está na lista de checks obrigatórios da main:
  # vulnerabilidade nova em dependência não deve travar PR que não mexeu nela. Lê o
  # resumo no log; promover a obrigatório depois de uma rodada limpa.
  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - name: govulncheck (Go)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      # O lock já fixa tudo: sem resolver nada, só compara versões+hashes com o banco de avisos.
      - name: pip-audit (Python, requirements-prod.lock)
        run: |
          pip install pip-audit==2.10.1
          pip-audit --requirement agente-ia/requirements-prod.lock --require-hashes --no-deps --disable-pip --progress-spinner off
