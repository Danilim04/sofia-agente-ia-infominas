# ==============================================================================
# Deploy da Sofia — MANUAL (workflow_dispatch), sem gatilho automático.
#
# A infra da Infominas ainda não existe para nós (P10: host, domínio HTTPS,
# quem opera), então esta pipeline NÃO entrega em lugar nenhum: ela prova que o
# que seria entregue está íntegro —
#   1. validar: deploy/checar-env.py (toda variável lida pelo código está no
#      .env.example, nenhum segredo preenchido) + `docker compose config` da
#      base e da base+produção;
#   2. imagens: constrói sofia-bot:brain-<tag> e sofia-bot:gateway-<tag>
#      (sem push: não há registry definido).
# O passo de entrega (SSH, registry, orquestrador) entra aqui quando P10 for
# respondida — runbook em deploy/README.md. Esta pipeline não usa nenhum secret.
# ==============================================================================
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag das imagens (vazio = manual-<sha7> do commit)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: .env.example × código e docker compose config
        run: python deploy/checar-env.py

  imagens:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve a tag
        id: ver
        env:
          TAG_INFORMADA: ${{ inputs.tag }}
        run: |
          t="$TAG_INFORMADA"
          [ -n "$t" ] || t="manual-$(git rev-parse --short=7 HEAD)"
          [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "tag inválida: use letras, dígitos, _ . -" >&2; exit 1; }
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - name: Build do gateway (Go)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: docker build -t "sofia-bot:gateway-$TAG" backend/

      - name: Build do cérebro (Python)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: docker build -t "sofia-bot:brain-$TAG" agente-ia/
