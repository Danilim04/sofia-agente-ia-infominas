# Inventário estático da VM do bot. ansible_host = IP da VM. A pipeline de
# deploy também lê o IP DAQUI (fonte única, mesmo padrão do omni-route).
#
# VM atual (desde 2026-09-10): provisionada pela Azapfy — Debian 13 (trixie),
# ARM64/aarch64, 12 vCPU / 23 GB RAM / 755 GB, hostname omni-route.azapfy.com.br.
# É COMPARTILHADA com a stack omni-route (tenant azapfy): o Chatwoot que o bot
# atende roda nela, na rede docker `omniroute_default`.
#
# Por ser ARM64, as imagens do bot são construídas NA PRÓPRIA VM
# (deploy/deploy-remote.sh --build-on-host) — o runner do GitHub é x86_64.
#
# A VM anterior (Hetzner 62.238.63.240, x86_64/Ubuntu) foi desativada; o root
# infra/terraform descreve AQUELA VM e NÃO se aplica a esta (provisionada fora
# do nosso Terraform).
all:
  children:
    bot:
      hosts:
        azapfy-bot:
          ansible_host: 152.53.208.178
