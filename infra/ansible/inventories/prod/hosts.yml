# Inventário estático da VM do bot. ansible_host = IP da VM (saída bot_ipv4
# do infra/terraform — atualizar após qualquer recreate). A pipeline de deploy
# também lê o IP DAQUI (fonte única, mesmo padrão do omni-route).
#
# Obs.: a VM é compartilhada com a stack omni-route (tenant azapfy) — o
# Chatwoot que o bot atende roda nela.
all:
  children:
    bot:
      hosts:
        azapfy-bot:
          ansible_host: 62.238.63.240
